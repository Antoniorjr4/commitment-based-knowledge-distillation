name: Finite-population audit replay and release
on:
  pull_request:
    paths:
      - 'finite-population-audit/**'
      - '.github/workflows/finite-population-audit.yml'
      - '.zenodo.json'
  push:
    branches: [main]
    paths:
      - 'finite-population-audit/**'
      - '.github/workflows/finite-population-audit.yml'
      - '.zenodo.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: finite-population-audit/requirements-replay.txt
      - name: Verify release checksums
        working-directory: finite-population-audit
        run: sha256sum --check SHA256SUMS
      - name: Install replay dependencies
        run: python -m pip install -r finite-population-audit/requirements-replay.txt
      - name: Reproduce the frozen audit offline
        run: python finite-population-audit/verification/reproduce.py --output /tmp/audit-replay
      - uses: actions/upload-artifact@v4
        with:
          name: finite-population-audit-replay
          path: /tmp/audit-replay/
          retention-days: 30
  release:
    if: github.ref == 'refs/heads/main'
    needs: replay
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: |
          python - <<'PY'
          import zipfile, pathlib, hashlib
          root=pathlib.Path('finite-population-audit')
          output=pathlib.Path('audit-large-v1.0.0.zip')
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(root.rglob('*')):
                  if file.is_file(): archive.write(file,file)
          pathlib.Path('audit-large-v1.0.0.zip.sha256').write_text(hashlib.sha256(output.read_bytes()).hexdigest()+'  '+output.name+'\n')
          PY
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=audit-large-v1.0.0
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; it will not be overwritten."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Finite-population fidelity audit — 2,048 reports" \
            --notes-file finite-population-audit/RELEASE_NOTES.md \
            finite-population-audit/paper/manuscript_en.pdf \
            audit-large-v1.0.0.zip \
            audit-large-v1.0.0.zip.sha256
