name: Reproduce Baseline V1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-v1:
    name: Foundry Baseline V1
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry 1.8.6
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6

      - name: Record toolchain
        run: |
          forge --version
          solc --version || true

      - name: Install pinned forge-std
        run: |
          forge install foundry-rs/forge-std --no-commit
          git -C lib/forge-std checkout f3dae6e6ee381f25eb6a246f7da9b85c91a68219
          test "$(git -C lib/forge-std rev-parse HEAD)" = "f3dae6e6ee381f25eb6a246f7da9b85c91a68219"

      - name: Run Baseline V1 tests
        run: forge test -vv | tee baseline-test.txt

      - name: Run Baseline V1 gas report
        run: forge test --gas-report -vv | tee baseline-gas-report.txt

      - name: Verify test count
        run: |
          grep -Eq '11 tests passed|11 passed' baseline-test.txt
          grep -Eq '0 failed' baseline-test.txt

      - name: Preserve reproduction logs
        uses: actions/upload-artifact@v4
        with:
          name: baseline-v1-reproduction-logs
          path: |
            baseline-test.txt
            baseline-gas-report.txt
